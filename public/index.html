<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarrBot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--sidebar:#16213e;--card:#1e2a45;--input:#0f1729;--accent:#5865F2;--accent-hover:#4752c4;--text:#e0e0e0;--text-dim:#888;--green:#57F287;--red:#ED4245;--yellow:#FEE75C;--border:#2a3a5c}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ── Sidebar ─────────────────────────────────────────── */
#sidebar{width:260px;background:var(--sidebar);display:flex;flex-direction:column;border-right:1px solid var(--border);flex-shrink:0}
.sidebar-header{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:18px;font-weight:700;color:#fff}
.sidebar-header span{color:var(--accent);font-size:12px}
.sidebar-bots{flex:1;overflow-y:auto;padding:8px}
.sidebar-bots h3{font-size:11px;text-transform:uppercase;color:var(--text-dim);padding:8px 8px 4px;letter-spacing:0.5px}
.bot-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background 0.15s}
.bot-item:hover{background:rgba(88,101,242,0.1)}
.bot-item.active{background:rgba(88,101,242,0.2)}
.bot-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.bot-dot.stopped{background:#555}
.bot-dot.running{background:var(--green)}
.bot-dot.error{background:var(--red)}
.bot-dot.starting{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.bot-name{font-size:14px;font-weight:500}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#c03537}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:#253555}
.btn-success{background:var(--green);color:#111}.btn-success:hover{background:#45c774}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%}
.sidebar-btn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:10px;border-radius:8px;font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;transition:background 0.15s}
.sidebar-btn:hover{background:rgba(88,101,242,0.1)}

/* ── Main Content ────────────────────────────────────── */
#main{flex:1;overflow-y:auto;padding:32px}
.page{display:none;max-width:900px;margin:0 auto}
.page.active{display:block}
.page h2{font-size:22px;margin-bottom:20px}
.page h3{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
.stat-card .value{font-size:28px;font-weight:700;color:#fff}
.stat-card .label{font-size:12px;color:var(--text-dim);margin-top:4px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:var(--text-dim)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent)}
.form-hint{font-size:11px;color:var(--text-dim);margin-top:3px}
.form-row{display:flex;gap:12px}
.form-row>*{flex:1}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:1000;animation:fadeIn 0.2s}
.toast-success{background:var(--green);color:#111}
.toast-error{background:var(--red);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.error-log{max-height:300px;overflow-y:auto;font-family:monospace;font-size:12px;background:var(--input);border-radius:6px;padding:12px}
.error-log .entry{padding:4px 0;border-bottom:1px solid var(--border)}
.error-log .time{color:var(--text-dim)}
.source-list{display:flex;flex-direction:column;gap:8px}
.source-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--input);border-radius:6px}
.source-item .url{flex:1;font-size:13px;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.source-item .label{font-size:12px;color:var(--text-dim);min-width:80px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-state h3{color:var(--text);margin-bottom:8px}

/* ── Wizard ──────────────────────────────────────────── */
.wizard{max-width:600px;margin:0 auto}
.wizard .step-indicator{display:flex;gap:4px;margin-bottom:24px}
.wizard .step-dot{flex:1;height:4px;background:var(--border);border-radius:2px}
.wizard .step-dot.done{background:var(--accent)}
.wizard .step-dot.active{background:var(--green)}
.wizard h2{font-size:20px;margin-bottom:4px}
.wizard .subtitle{color:var(--text-dim);margin-bottom:20px}
.wizard .step-actions{display:flex;gap:8px;margin-top:20px}
.instructions{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:16px;margin:12px 0;font-size:13px;line-height:1.6}
.instructions code{background:var(--card);padding:2px 6px;border-radius:4px;font-size:12px}
.instructions a{color:var(--accent)}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <h1>StarrBot</h1>
    <span>multi-bot dashboard</span>
  </div>
  <div class="sidebar-bots">
    <h3>Bots</h3>
    <div id="botList"></div>
  </div>
  <div class="sidebar-footer">
    <button class="sidebar-btn" onclick="showAddBot()">+ Add Bot</button>
    <button class="sidebar-btn" onclick="showPage('global-settings')">Settings</button>
  </div>
</div>

<div id="main">
  <!-- Login -->
  <div id="loginPage" class="page active" style="display:none">
    <div style="max-width:360px;margin:100px auto;text-align:center">
      <h2>StarrBot</h2>
      <p style="color:var(--text-dim);margin:8px 0 20px">Enter password to continue</p>
      <div class="form-group">
        <input type="password" id="loginPw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn btn-primary btn-full" onclick="doLogin()">Login</button>
    </div>
  </div>

  <!-- Onboarding Wizard -->
  <div id="onboardingPage" class="page">
    <div class="wizard">
      <div class="step-indicator" id="wizardSteps"></div>
      <div id="wizardContent"></div>
    </div>
  </div>

  <!-- Bot Overview -->
  <div id="overviewPage" class="page">
    <h2 id="overviewTitle">Bot Overview</h2>
    <div class="stat-grid" id="overviewStats"></div>
    <div id="overviewActions"></div>
    <div class="card">
      <h3>Error Log</h3>
      <div class="error-log" id="errorLog"><div class="empty-state" style="padding:20px">No errors</div></div>
    </div>
  </div>

  <!-- Functions -->
  <div id="functionsPage" class="page">
    <h2 id="functionsTitle">Functions</h2>
    <div id="functionsContent"></div>
  </div>

  <!-- Bot Settings -->
  <div id="botSettingsPage" class="page">
    <h2>Bot Settings</h2>
    <div class="card">
      <div class="form-group">
        <label>Bot Name</label>
        <input type="text" id="settingName">
      </div>
      <div class="form-group">
        <label>Bot Token</label>
        <input type="password" id="settingToken" placeholder="Leave empty to keep current">
        <div class="form-hint">Bot tokens are masked in the dashboard and API responses</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-primary" onclick="saveBotSettings()">Save</button>
        <button class="btn btn-danger" onclick="deleteCurrentBot()">Delete Bot</button>
      </div>
    </div>
  </div>

  <!-- Global Settings -->
  <div id="globalSettingsPage" class="page">
    <h2>Global Settings</h2>
    <div class="card">
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" id="globalPw" placeholder="Set or change password">
        <div class="form-hint">Required for dashboard and API access</div>
      </div>
      <button class="btn btn-primary" onclick="saveGlobalPw()">Save Password</button>
    </div>
  </div>
</div>

<script>
let pw = '';
let bots = [];
let selectedBot = null;
let wizardState = { step: 0, token: '', clientId: '', name: '', serverId: '', botInfo: null };

const API = {
  async get(url) { return fetch(url, { headers: { 'X-Admin-Password': pw } }).then(r => r.json()); },
  async post(url, body) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pw }, body: JSON.stringify(body) }).then(r => r.json()); },
  async put(url, body) { return fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pw }, body: JSON.stringify(body) }).then(r => r.json()); },
  async del(url) { return fetch(url, { method: 'DELETE', headers: { 'X-Admin-Password': pw } }).then(r => r.json()); },
};

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const el = document.getElementById(id + 'Page');
  if (el) el.classList.add('active');
}

function renderSidebar() {
  const list = document.getElementById('botList');
  list.innerHTML = bots.map(b => `
    <div class="bot-item ${selectedBot === b.id ? 'active' : ''}" onclick="selectBot('${b.id}')">
      <div class="bot-dot ${b.status}"></div>
      <span class="bot-name">${esc(b.name)}</span>
    </div>
  `).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Login ──────────────────────────────────────────────
async function init() {
  const status = await API.get('/api/status');
  if (!status.configured && !status.hasPassword) {
    showPage('onboarding');
    renderWizard();
    return;
  }
  if (status.hasPassword && !pw) {
    document.getElementById('loginPage').style.display = 'block';
    showPage('login');
    return;
  }
  await loadBots();
}

async function doLogin() {
  pw = document.getElementById('loginPw').value;
  const res = await API.post('/api/auth/login', { password: pw });
  if (res.error) { toast(res.error, 'error'); return; }
  document.getElementById('loginPage').style.display = 'none';
  await loadBots();
}

// ── Bots ───────────────────────────────────────────────
async function loadBots() {
  bots = await API.get('/api/bots');
  renderSidebar();
  if (bots.length === 0) { showAddBot(); }
  else if (!selectedBot || !bots.find(b => b.id === selectedBot)) { selectBot(bots[0].id); }
}

function selectBot(id) {
  selectedBot = id;
  renderSidebar();
  showBotOverview(id);
}

async function showBotOverview(id) {
  const bot = bots.find(b => b.id === id);
  if (!bot) return;
  document.getElementById('overviewTitle').textContent = bot.name;
  const stats = await API.get(`/api/bots/${id}/stats`);
  const logs = await API.get(`/api/bots/${id}/logs`);
  const config = await API.get(`/api/bots/${id}`);

  document.getElementById('overviewStats').innerHTML = `
    <div class="stat-card"><div class="value" style="color:${bot.status==='running'?'var(--green)':bot.status==='error'?'var(--red)':'#555'}">${bot.status}</div><div class="label">Status</div></div>
    <div class="stat-card"><div class="value">${stats.postsSent||0}</div><div class="label">Posts Sent</div></div>
    <div class="stat-card"><div class="value">${stats.errors||0}</div><div class="label">Errors</div></div>
    <div class="stat-card"><div class="value">${stats.lastCheck ? timeSince(stats.lastCheck) : 'Never'}</div><div class="label">Last Check</div></div>
    <div class="stat-card"><div class="value">${stats.ticketsCreated||0}</div><div class="label">Tickets</div></div>
    <div class="stat-card"><div class="value">${(stats.functions||[]).length}</div><div class="label">Active Functions</div></div>
  `;

  const logEl = document.getElementById('errorLog');
  if (logs.length) {
    logEl.innerHTML = logs.map(l => `<div class="entry"><span class="time">${new Date(l.timestamp).toLocaleTimeString()}</span> ${esc(l.message)}</div>`).join('');
  } else {
    logEl.innerHTML = '<div class="empty-state" style="padding:20px">No logs</div>';
  }

  const hasToken = !!config.token;
  const startStop = bot.status === 'running'
    ? `<button class="btn btn-danger" onclick="stopBot('${id}')">Stop Bot</button>`
    : `<button class="btn btn-success" onclick="startBot('${id}')" ${!hasToken?'disabled title="Set token first"':''}>Start Bot</button>`;

  document.getElementById('overviewActions').innerHTML = `<div style="display:flex;gap:8px;margin-bottom:16px">${startStop}<button class="btn btn-secondary" onclick="showBotFunctions('${id}')">Configure Functions</button><button class="btn btn-secondary" onclick="showBotSettings('${id}')">Settings</button></div>`;

  showPage('overview');
}

async function startBot(id) {
  toast('Starting bot...');
  const res = await API.post(`/api/bots/${id}/start`);
  if (res.error) { toast(res.error, 'error'); }
  await loadBots();
  if (selectedBot) showBotOverview(id);
}

async function stopBot(id) {
  await API.post(`/api/bots/${id}/stop`);
  await loadBots();
  if (selectedBot) showBotOverview(id);
}

// ── Add Bot ────────────────────────────────────────────
function showAddBot() {
  wizardState = { step: 0, token: '', clientId: '', name: '', serverId: '', botInfo: null };
  showPage('onboarding');
  renderWizard();
}

const WIZARD_STEPS = ['Create Bot', 'Credentials', 'Invite', 'Done'];

function renderWizard() {
  const ind = document.getElementById('wizardSteps');
  ind.innerHTML = WIZARD_STEPS.map((_, i) => `<div class="step-dot ${i < wizardState.step ? 'done' : i === wizardState.step ? 'active' : ''}"></div>`).join('');

  const c = document.getElementById('wizardContent');
  const s = wizardState.step;

  if (s === 0) {
    c.innerHTML = `
      <h2>Create a Discord Bot</h2>
      <p class="subtitle">Step 1 of ${WIZARD_STEPS.length}</p>
      <div class="instructions">
        <ol style="padding-left:16px">
          <li>Go to <a href="https://discord.com/developers/applications" target="_blank">Discord Developer Portal</a></li>
          <li>Click <strong>New Application</strong> and give it a name</li>
          <li>Go to <strong>Bot</strong> in the left sidebar</li>
          <li>Click <strong>Reset Token</strong> and copy the token</li>
          <li>Under <strong>Privileged Gateway Intents</strong>, enable:<br>- Message Content Intent<br>- Server Members Intent</li>
        </ol>
      </div>
      <div class="step-actions">
        <button class="btn btn-primary" onclick="wizardState.step=1;renderWizard()">Next: Enter Credentials</button>
      </div>
    `;
  } else if (s === 1) {
    c.innerHTML = `
      <h2>Enter Credentials</h2>
      <p class="subtitle">Step 2 of ${WIZARD_STEPS.length}</p>
      <div class="form-group">
        <label>Bot Name</label>
        <input type="text" id="wizName" value="${esc(wizardState.name)}" placeholder="e.g. Mkitty">
      </div>
      <div class="form-group">
        <label>Bot Token</label>
        <input type="password" id="wizToken" value="${esc(wizardState.token)}" placeholder="Paste your bot token">
      </div>
      <div class="form-group">
        <label>Application (Client) ID</label>
        <input type="text" id="wizClientId" value="${esc(wizardState.clientId)}" placeholder="Found on the General Information page">
      </div>
      <div id="wizValidation" style="margin:8px 0;font-size:13px"></div>
      <div class="step-actions">
        <button class="btn btn-secondary" onclick="wizardState.step=0;renderWizard()">Back</button>
        <button class="btn btn-primary" onclick="validateAndNext()">Validate & Next</button>
      </div>
    `;
  } else if (s === 2) {
    const cid = wizardState.clientId;
    const oauthUrl = `https://discord.com/api/oauth2/authorize?client_id=${cid}&permissions=2147485696&scope=bot%20applications.commands`;
    c.innerHTML = `
      <h2>Invite to Server</h2>
      <p class="subtitle">Step 3 of ${WIZARD_STEPS.length}</p>
      <div class="instructions">
        <p>Click the link below to invite your bot to a Discord server:</p>
        <p style="margin:12px 0"><a href="${oauthUrl}" target="_blank" class="btn btn-primary">Invite Bot to Server</a></p>
        <p style="color:var(--text-dim);font-size:12px">Make sure you have <strong>Manage Server</strong> permission on the target server.</p>
      </div>
      <div class="step-actions">
        <button class="btn btn-secondary" onclick="wizardState.step=1;renderWizard()">Back</button>
        <button class="btn btn-primary" onclick="wizardState.step=3;renderWizard()">Next: Finish</button>
      </div>
    `;
  } else if (s === 3) {
    c.innerHTML = `
      <h2>All Done!</h2>
      <p class="subtitle">Step ${WIZARD_STEPS.length} of ${WIZARD_STEPS.length}</p>
      <div class="instructions">
        <p>Your bot <strong>${esc(wizardState.name)}</strong> has been created in StarrBot.</p>
        <p style="margin:8px 0">It's currently <strong>stopped</strong>. You can:</p>
        <ul style="padding-left:16px">
          <li>Configure functions (Updates, Tickets) from the <strong>Functions</strong> tab</li>
          <li>Click <strong>Start Bot</strong> to bring it online</li>
        </ul>
      </div>
      <div class="step-actions">
        <button class="btn btn-success" onclick="finishWizard()">Create Bot & Go to Dashboard</button>
      </div>
    `;
  }
}

async function validateAndNext() {
  wizardState.name = document.getElementById('wizName').value.trim();
  wizardState.token = document.getElementById('wizToken').value.trim();
  wizardState.clientId = document.getElementById('wizClientId').value.trim();
  if (!wizardState.name || !wizardState.token || !wizardState.clientId) { toast('All fields required', 'error'); return; }

  const el = document.getElementById('wizValidation');
  el.innerHTML = '<span style="color:var(--yellow)">Validating token...</span>';
  const res = await API.post('/api/validate-token', { token: wizardState.token });
  if (!res.valid) { el.innerHTML = `<span style="color:var(--red)">Invalid token: ${esc(res.error)}</span>`; return; }
  el.innerHTML = `<span style="color:var(--green)">Valid! Bot: ${esc(res.bot.username)}#${res.bot.discriminator || '0'}</span>`;
  wizardState.step = 2;
  renderWizard();
}

async function finishWizard() {
  const res = await API.post('/api/bots', { name: wizardState.name, token: wizardState.token, clientId: wizardState.clientId });
  if (res.error) { toast(res.error, 'error'); return; }
  toast('Bot created!');
  await loadBots();
  selectBot(res.id);
}

// ── Functions Page ─────────────────────────────────────
async function showBotFunctions(id) {
  document.getElementById('functionsTitle').textContent = `${bots.find(b=>b.id===id)?.name || ''} — Functions`;
  const content = document.getElementById('functionsContent');

  const updates = await API.get(`/api/bots/${id}/functions/updates`);
  const tickets = await API.get(`/api/bots/${id}/functions/tickets`);

  content.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div><strong>📡 Updates</strong><br><span style="color:var(--text-dim);font-size:12px">Monitor social feeds and post updates</span></div>
        <button class="btn btn-sm ${updates?.enabled ? 'btn-success' : 'btn-secondary'}" onclick="toggleFunc('${id}','updates',${!updates?.enabled})">${updates?.enabled ? 'Enabled' : 'Disabled'}</button>
      </div>
      <div class="form-group"><label>RSSHub URL</label><input type="text" id="funcRsshub" value="${esc(updates?.rsshubUrl||'http://rsshub:1200')}"></div>
      <div class="form-group"><label>Check Interval (minutes)</label><input type="number" id="funcInterval" value="${updates?.checkInterval||15}"></div>
      <div class="form-group"><label>Post Channel ID</label><input type="text" id="funcChannel" value="${esc(updates?.channelId||'')}"><div class="form-hint">Right-click channel → Copy Channel ID</div></div>
      <h3>Sources</h3>
      <div class="source-list" id="sourceList">
        ${(updates?.sources||[]).map((s,i) => `<div class="source-item"><span class="label">${esc(s.label||'')}</span><span class="url">${esc(s.url)}</span><button class="btn btn-sm btn-danger" onclick="removeSource('${id}',${i})">Remove</button></div>`).join('') || '<div style="color:var(--text-dim);font-size:13px;padding:8px">No sources configured</div>'}
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input type="text" id="newSourceUrl" placeholder="/tiktok/user/username or full URL" style="flex:1;padding:8px;background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
        <input type="text" id="newSourceLabel" placeholder="Label (optional)" style="width:120px;padding:8px;background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
        <button class="btn btn-sm btn-primary" onclick="addSource('${id}')">Add</button>
      </div>
      <div style="margin-top:12px"><button class="btn btn-primary" onclick="saveUpdates('${id}')">Save Updates Config</button></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div><strong>🎫 Tickets</strong><br><span style="color:var(--text-dim);font-size:12px">Support ticket system with threads</span></div>
        <button class="btn btn-sm ${tickets?.enabled ? 'btn-success' : 'btn-secondary'}" onclick="toggleFunc('${id}','tickets',${!tickets?.enabled})">${tickets?.enabled ? 'Enabled' : 'Disabled'}</button>
      </div>
      <div class="form-group"><label>Admin Channel ID</label><input type="text" id="funcTicketAdmin" value="${esc(tickets?.adminChannelId||'')}"><div class="form-hint">Where tickets are created</div></div>
      <div class="form-group"><label>Admin Role ID</label><input type="text" id="funcTicketRole" value="${esc(tickets?.adminRoleId||'')}"><div class="form-hint">Optional — leave empty for everyone</div></div>
      <div style="margin-top:12px"><button class="btn btn-primary" onclick="saveTickets('${id}')">Save Tickets Config</button></div>
    </div>
  `;
  showPage('functions');
}

async function toggleFunc(botId, funcName, enabled) {
  await API.put(`/api/bots/${botId}/functions/${funcName}`, { enabled });
  toast(`${funcName} ${enabled ? 'enabled' : 'disabled'}`);
  showBotFunctions(botId);
}

async function saveUpdates(botId) {
  await API.put(`/api/bots/${botId}/functions/updates`, {
    rsshubUrl: document.getElementById('funcRsshub').value,
    checkInterval: parseInt(document.getElementById('funcInterval').value) || 15,
    channelId: document.getElementById('funcChannel').value,
  });
  toast('Updates config saved');
}

async function saveTickets(botId) {
  await API.put(`/api/bots/${botId}/functions/tickets`, {
    adminChannelId: document.getElementById('funcTicketAdmin').value,
    adminRoleId: document.getElementById('funcTicketRole').value,
  });
  toast('Tickets config saved');
}

async function addSource(botId) {
  const url = document.getElementById('newSourceUrl').value.trim();
  const label = document.getElementById('newSourceLabel').value.trim();
  if (!url) return;
  const config = await API.get(`/api/bots/${botId}/functions/updates`);
  const sources = config?.sources || [];
  sources.push({ url, label: label || url, platform: 'auto' });
  await API.put(`/api/bots/${botId}/functions/updates`, { sources });
  document.getElementById('newSourceUrl').value = '';
  document.getElementById('newSourceLabel').value = '';
  showBotFunctions(botId);
}

async function removeSource(botId, idx) {
  const config = await API.get(`/api/bots/${botId}/functions/updates`);
  const sources = config?.sources || [];
  sources.splice(idx, 1);
  await API.put(`/api/bots/${botId}/functions/updates`, { sources });
  showBotFunctions(botId);
}

// ── Bot Settings ───────────────────────────────────────
function showBotSettings(id) {
  const bot = bots.find(b => b.id === id);
  if (!bot) return;
  document.getElementById('settingName').value = bot.name;
  document.getElementById('settingToken').value = '';
  showPage('bot-settings');
}

async function saveBotSettings() {
  if (!selectedBot) return;
  const body = { name: document.getElementById('settingName').value };
  const token = document.getElementById('settingToken').value;
  if (token) body.token = token;
  await API.put(`/api/bots/${selectedBot}`, body);
  toast('Settings saved');
  await loadBots();
}

async function deleteCurrentBot() {
  if (!selectedBot || !confirm('Delete this bot? This cannot be undone.')) return;
  await API.del(`/api/bots/${selectedBot}`);
  selectedBot = null;
  await loadBots();
  if (bots.length) selectBot(bots[0].id);
  else showAddBot();
}

// ── Global Settings ────────────────────────────────────
async function saveGlobalPw() {
  const newPw = document.getElementById('globalPw').value;
  if (!newPw) return;
  await API.post('/api/auth/password', { password: newPw });
  pw = newPw;
  toast('Password updated');
  document.getElementById('globalPw').value = '';
}

// ── SSE ────────────────────────────────────────────────
function connectSSE() {
  const es = new EventSource('/api/events');
  es.addEventListener('bot:status', (e) => {
    const data = JSON.parse(e.data);
    const bot = bots.find(b => b.id === data.id);
    if (bot) { bot.status = data.status; bot.error = data.error; }
    renderSidebar();
  });
  es.addEventListener('bot:log', (e) => {
    const data = JSON.parse(e.data);
    if (data.id === selectedBot) {
      const log = document.getElementById('errorLog');
      if (log) {
        const empty = log.querySelector('.empty-state');
        if (empty) empty.remove();
        log.insertAdjacentHTML('afterbegin', `<div class="entry"><span class="time">${new Date(data.timestamp).toLocaleTimeString()}</span> ${esc(data.message)}</div>`);
      }
    }
  });
}

function timeSince(ts) {
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return `${m}m ago`;
  return `${Math.floor(m/60)}h ${m%60}m ago`;
}

// ── Init ───────────────────────────────────────────────
init();
connectSSE();
</script>
</body>
</html>
