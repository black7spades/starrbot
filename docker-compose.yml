services:
  bot:
    image: ghcr.io/black7spades/mkittybot:latest
    restart: unless-stopped
    env_file: .env
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - rsshub

  rsshub:
    image: diygod/rsshub
    restart: unless-stopped
    environment:
      - CACHE_TYPE=memory
    ports:
      - "1200:1200"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --label-enable
