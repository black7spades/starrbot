services:
  bot:
    image: ghcr.io/black7spades/mkittybot:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./feeds.json:/app/feeds.json
    depends_on:
      - rsshub

  rsshub:
    build:
      context: .
      dockerfile: Dockerfile.rsshub
    image: ghcr.io/black7spades/rsshub-playwright:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - CACHE_TYPE=memory
    ports:
      - "1200:1200"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
