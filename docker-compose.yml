services:
  bot:
    image: ghcr.io/black7spades/mkittybot:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./feeds.json:/app/feeds.json
    depends_on:
      - rsshub

  rsshub:
    build:
      context: .
      dockerfile: Dockerfile.rsshub
    image: ghcr.io/black7spades/rsshub-playwright:latest
    restart: unless-stopped
    env_file: .env.rsshub
    environment:
      - CACHE_TYPE=memory
    ports:
      - "1200:1200"
